# AgentStore — Docker Compose (one-command deployment)
#
# Quick start:
#   cp .env.docker.example .env   # fill in secrets + optional LLM keys
#   docker compose up -d          # pulls/builds images, starts MongoDB + app
#   open http://localhost:8080    # browser setup wizard on first boot
#
# To use the pre-built image instead of building from source, comment out the
# `build: .` line and uncomment the `image:` line under the `app` service.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - agentstore
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    # image: ghcr.io/givemifi/agentstore:latest  # ← uncomment to skip local build
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override connection string to point at the compose Mongo service
      MONGODB_URI: mongodb://mongo:27017/${DATABASE_NAME:-agentstore}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      # Set FRONTEND_URL to your public domain in production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Optional: non-interactive first-run setup (skips web wizard).
      # Uncomment and fill to create the admin account automatically on first boot.
      # AGENTSTORE_SETUP_ORG: ${AGENTSTORE_SETUP_ORG:-}
      # AGENTSTORE_SETUP_NAME: ${AGENTSTORE_SETUP_NAME:-}
      # AGENTSTORE_SETUP_EMAIL: ${AGENTSTORE_SETUP_EMAIL:-}
      # AGENTSTORE_SETUP_PASSWORD: ${AGENTSTORE_SETUP_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - agentstore

volumes:
  mongo_data:

networks:
  agentstore:
    driver: bridge
