# Smithery configuration for AgentStore MCP server
# https://smithery.ai/docs/build

runtime: go
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      agentstoreUrl:
        type: string
        description: "Base URL of your AgentStore instance (e.g., https://your-app.fly.dev)"
      apiKey:
        type: string
        description: "Root-tenant API key with admin authority (starts with lsk_)"
    required:
      - agentstoreUrl
      - apiKey
  commandFunction: |
    (config) => ({
      command: "./agentstore",
      args: ["mcp"],
      env: {
        AGENTSTORE_URL: config.agentstoreUrl,
        AGENTSTORE_API_KEY: config.apiKey
      }
    })
