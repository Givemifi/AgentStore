server:
  host: ${SERVER_HOST:0.0.0.0}
  port: ${SERVER_PORT:4290}

database:
  uri: ${MONGODB_URI}
  name: ${DATABASE_NAME}

frontend:
  url: ${FRONTEND_URL}
  static_dir: ${FRONTEND_STATIC_DIR:/app/static}

jwt:
  access_secret: ${JWT_ACCESS_SECRET}
  refresh_secret: ${JWT_REFRESH_SECRET}
  access_ttl_minutes: 60
  refresh_ttl_days: 30

oauth:
  google_client_id: ${GOOGLE_CLIENT_ID}
  google_client_secret: ${GOOGLE_CLIENT_SECRET}
  google_redirect_url: ${GOOGLE_REDIRECT_URL}
  github_client_id: ${GITHUB_CLIENT_ID}
  github_client_secret: ${GITHUB_CLIENT_SECRET}
  github_redirect_url: ${GITHUB_REDIRECT_URL}
  microsoft_client_id: ${MICROSOFT_CLIENT_ID}
  microsoft_client_secret: ${MICROSOFT_CLIENT_SECRET}
  microsoft_redirect_url: ${MICROSOFT_REDIRECT_URL}

email:
  resend_api_key: ${RESEND_API_KEY}
  from_email: ${FROM_EMAIL}
  from_name: ${FROM_NAME}

app:
  name: ${APP_NAME}

stripe:
  secret_key: ${STRIPE_SECRET_KEY}
  publishable_key: ${STRIPE_PUBLISHABLE_KEY}
  webhook_secret: ${STRIPE_WEBHOOK_SECRET}

# 微信支付 V3（可选，不填则不启用）
wechat_pay:
  app_id: ${WECHAT_PAY_APP_ID}
  mch_id: ${WECHAT_PAY_MCH_ID}
  api_v3_key: ${WECHAT_PAY_API_V3_KEY}
  private_key: ${WECHAT_PAY_PRIVATE_KEY}
  cert_serial_no: ${WECHAT_PAY_CERT_SERIAL_NO}
  notify_url: ${WECHAT_PAY_NOTIFY_URL}

# 支付宝网页支付（可选，不填则不启用）
alipay:
  app_id: ${ALIPAY_APP_ID}
  private_key: ${ALIPAY_PRIVATE_KEY}
  public_key: ${ALIPAY_PUBLIC_KEY}
  notify_url: ${ALIPAY_NOTIFY_URL}
  return_url: ${ALIPAY_RETURN_URL}
  is_sandbox: ${ALIPAY_IS_SANDBOX:false}

webhooks:
  encryption_key: ${WEBHOOK_ENCRYPTION_KEY}

datadog:
  api_key: ${DATADOG_API_KEY}
  site: ${DATADOG_SITE:us5.datadoghq.com}
  hostname: ${DATADOG_HOSTNAME}
